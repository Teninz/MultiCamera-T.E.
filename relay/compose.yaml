services:
  relay:
    build: .
    restart: unless-stopped
    environment:
      MULTICAMERA_HOST_KEY: ${MULTICAMERA_HOST_KEY:?Set MULTICAMERA_HOST_KEY in .env}
    expose:
      - "8080"
  caddy:
    image: caddy:2
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
volumes:
  caddy_data:
  caddy_config:
